name: Update Symbol Names Cache

on:
  schedule:
    - cron: '0 3 * * 0'   # 03:00 UTC every Sunday
  workflow_dispatch:

jobs:
  update-names:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch missing symbol names from Finnhub
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scripts/fetch_symbol_names.py

      - name: Commit updated names cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/symbol_names.json
          git diff --staged --quiet || git commit -m "chore: update symbol names cache [skip ci]"
          git push
